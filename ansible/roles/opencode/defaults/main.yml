---
opencode_version: latest
opencode_install_only: false
opencode_config_dir: "{{ user_context_home }}/.config/opencode"
opencode_source_dir: "{{ dotfiles_repo_dir | default(playbook_dir ~ '/..') }}/home/.config/opencode"
opencode_bin_dir: "{{ user_context_home }}/.local/bin"
opencode_install_dir: "{{ user_context_home }}/.local/share/opencode/releases/{{ opencode_resolved_version }}"
opencode_cache_dir: "{{ user_context_home }}/.cache/opencode-install"
opencode_executable: "{{ opencode_bin_dir }}/opencode"
opencode_platform: "{{ 'darwin' if ansible_facts['os_family'] == 'Darwin' else 'linux' }}"
opencode_arch_map:
  x86_64: x64
  arm64: arm64
  aarch64: arm64
opencode_platform_arch: "{{ opencode_platform }}-{{ opencode_arch_map[ansible_facts['architecture']] }}"
