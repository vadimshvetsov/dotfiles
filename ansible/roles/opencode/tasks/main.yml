---
- name: Configure OpenCode as the owner
  become: "{{ user_context_user != ansible_facts['user_id'] }}"
  become_user: "{{ user_context_user }}"
  environment:
    HOME: "{{ user_context_home }}"
    XDG_CONFIG_HOME: "{{ user_context_home }}/.config"
    XDG_CACHE_HOME: "{{ user_context_home }}/.cache"
    XDG_DATA_HOME: "{{ user_context_home }}/.local/share"
    XDG_STATE_HOME: "{{ user_context_home }}/.local/state"
    PATH: "{{ nodejs_bin_dir | default(user_context_home ~ '/.local/bin') }}:{{ ansible_env.PATH }}"
  block:
    - name: Install OpenCode for macOS
      ansible.builtin.include_tasks: tasks_darwin.yml
      when: ansible_facts['os_family'] == 'Darwin'

    - name: Install OpenCode for Linux
      ansible.builtin.include_tasks: tasks_linux.yml
      when: ansible_facts['os_family'] == 'Debian'

    - name: Configure OpenCode preferences
      ansible.builtin.include_tasks: configure.yml
      when: not opencode_install_only | bool

    - name: Install the OpenCode skill catalog
      ansible.builtin.include_role:
        name: skills
        apply:
          tags: [skills, opencode]
      tags: [skills, opencode]
      when: not opencode_install_only | bool

    - name: Verify OpenCode starts without a model request
      ansible.builtin.command:
        argv: ["{{ opencode_executable }}", '--version']
      changed_when: false
      when: not ansible_check_mode

    - name: Validate the resolved OpenCode configuration without a model request
      ansible.builtin.command:
        argv: ["{{ opencode_executable }}", debug, config]
      changed_when: false
      no_log: true
      when:
        - not ansible_check_mode
        - not opencode_install_only | bool
