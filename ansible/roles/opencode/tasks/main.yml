---
- name: Configure OpenCode as the owner
  become: "{{ user_context_user != ansible_facts['user_id'] }}"
  become_user: "{{ user_context_user }}"
  environment:
    HOME: "{{ user_context_home }}"
    XDG_CONFIG_HOME: "{{ user_context_home }}/.config"
    XDG_CACHE_HOME: "{{ user_context_home }}/.cache"
    XDG_DATA_HOME: "{{ user_context_home }}/.local/share"
    XDG_STATE_HOME: "{{ user_context_home }}/.local/state"
    PATH: "{{ nodejs_bin_dir | default(user_context_home ~ '/.local/bin') }}:{{ ansible_env.PATH }}"
  block:
    - name: Inspect legacy provider credentials before V2 migration
      ansible.builtin.stat:
        path: "{{ user_context_home }}/.local/share/opencode/auth.json"
        get_checksum: false
      register: opencode_legacy_auth

    - name: Preserve legacy provider credentials locally for rollback
      ansible.builtin.copy:
        src: "{{ user_context_home }}/.local/share/opencode/auth.json"
        dest: "{{ user_context_home }}/.local/share/opencode/auth.json.pre-v2"
        remote_src: true
        force: false
        mode: "0600"
      no_log: true
      diff: false
      when: opencode_legacy_auth.stat.isreg | default(false)

    - name: Resolve the requested stable OpenCode release
      ansible.builtin.include_tasks: resolve.yml

    - name: Install the verified OpenCode release
      ansible.builtin.include_tasks: install.yml

    - name: Configure OpenCode preferences
      ansible.builtin.include_tasks: configure.yml
      when: not opencode_install_only | bool

    - name: Install the OpenCode skill catalog
      ansible.builtin.include_role:
        name: skills
        apply:
          tags: [skills, opencode]
      tags: [skills, opencode]
      when: not opencode_install_only | bool

    - name: Verify OpenCode starts without a model request
      ansible.builtin.command:
        argv: ["{{ opencode_executable }}", '--version']
      changed_when: false
      when: not ansible_check_mode


    - name: Validate the resolved OpenCode V2 configuration without a model request
      ansible.builtin.command:
        argv: ["{{ opencode_executable }}", debug, config, '--standalone']
      changed_when: false
      no_log: true
      register: opencode_disk_config
      when:
        - not ansible_check_mode
        - not opencode_install_only | bool

    - name: Refresh stale configuration in an idle OpenCode service
      ansible.builtin.include_tasks: refresh.yml
      when:
        - not ansible_check_mode
        - not opencode_install_only | bool
