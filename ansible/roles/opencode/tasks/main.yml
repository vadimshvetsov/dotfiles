---
- name: Install OpenCode for macOS
  ansible.builtin.include_tasks: tasks_darwin.yml
  when: ansible_os_family == "Darwin"

- name: Install OpenCode for Linux
  ansible.builtin.include_tasks: tasks_linux.yml
  when: ansible_os_family != "Darwin"

- name: Link OpenCode config directory
  ansible.builtin.file:
    src: "{{ opencode_source_dir }}"
    dest: "{{ opencode_config_dir }}"
    state: link
    force: true
  when: not opencode_install_only | bool
