---
- name: Install skill-creator for opencode
  ansible.builtin.shell: npx skills add anthropics/skills --skill skill-creator --agent opencode -g -y
  args:
    executable: /bin/bash
    creates: "{{ ansible_env.HOME }}/.agents/skills/skill-creator"

- name: Install opencode-expert skill for opencode
  ansible.builtin.shell: npx skills add https://github.com/s-hiraoku/synapse-a2a --skill opencode-expert --agent opencode -g -y
  args:
    executable: /bin/bash
    creates: "{{ ansible_env.HOME }}/.agents/skills/opencode-expert"
