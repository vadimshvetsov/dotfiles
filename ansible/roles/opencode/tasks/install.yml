---
- name: Require a supported OpenCode platform
  ansible.builtin.assert:
    that: ansible_facts['architecture'] in opencode_arch_map

- name: Create OpenCode installation directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"

  loop:
    - { path: "{{ opencode_bin_dir }}", mode: "0755" }
    - { path: "{{ opencode_install_dir }}", mode: "0755" }
    - { path: "{{ opencode_cache_dir }}", mode: "0700" }

- name: Download the verified OpenCode archive
  ansible.builtin.get_url:
    url: "{{ opencode_native_metadata.json.dist.tarball }}"
    dest: "{{ opencode_cache_dir }}/opencode-{{ opencode_resolved_version }}-{{ opencode_platform_arch }}.tgz"
    checksum: "{{ opencode_integrity_checksum.stdout }}"
    mode: "0600"
  when: not ansible_check_mode

- name: Extract the verified OpenCode release
  ansible.builtin.command:
    argv:
      - tar
      - '-xzf'
      - "{{ opencode_cache_dir }}/opencode-{{ opencode_resolved_version }}-{{ opencode_platform_arch }}.tgz"
      - '-C'
      - "{{ opencode_install_dir }}"
    creates: "{{ opencode_install_dir }}/package/bin/opencode"
  when: not ansible_check_mode

- name: Link the OpenCode executable
  ansible.builtin.file:
    src: "{{ opencode_install_dir }}/package/bin/opencode"
    dest: "{{ opencode_executable }}"
    state: link
    force: true
    follow: false
  when: not ansible_check_mode
