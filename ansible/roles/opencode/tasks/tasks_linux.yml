---
- name: Require a supported OpenCode architecture
  ansible.builtin.assert:
    that: ansible_facts['architecture'] in opencode_linux_arch

- name: Create OpenCode installation directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"

  loop:
    - { path: "{{ opencode_bin_dir }}", mode: "0755" }
    - { path: "{{ opencode_install_dir }}", mode: "0755" }
    - { path: "{{ opencode_cache_dir }}", mode: "0700" }

- name: Download the verified OpenCode archive
  ansible.builtin.get_url:
    url: >-
      https://github.com/anomalyco/opencode/releases/download/v{{ opencode_version
      }}/opencode-linux-{{ opencode_linux_arch[ansible_facts['architecture']] }}.tar.gz
    dest: "{{ opencode_cache_dir }}/opencode-{{ opencode_version }}.tar.gz"
    checksum: "{{ opencode_linux_checksums[ansible_facts['architecture']] }}"
    mode: "0600"
  when: not ansible_check_mode

- name: Extract the pinned OpenCode release
  ansible.builtin.command:
    argv: [tar, '-xzf', "{{ opencode_cache_dir }}/opencode-{{ opencode_version }}.tar.gz", '-C', "{{ opencode_install_dir }}"]
    creates: "{{ opencode_install_dir }}/opencode"
  when: not ansible_check_mode

- name: Link the OpenCode executable
  ansible.builtin.file:
    src: "{{ opencode_install_dir }}/opencode"
    dest: "{{ opencode_executable }}"
    state: link
    force: true
    follow: false
  when: not ansible_check_mode
