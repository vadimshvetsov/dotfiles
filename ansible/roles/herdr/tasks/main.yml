---
- name: Install Herdr for macOS
  ansible.builtin.include_tasks: tasks_darwin.yml
  when: ansible_os_family == "Darwin"

- name: Install Herdr for Linux
  ansible.builtin.include_tasks: tasks_linux.yml
  when: ansible_os_family != "Darwin"

- name: Ensure Herdr runtime config directory exists
  ansible.builtin.file:
    path: "{{ herdr_config_dir }}"
    state: directory
    mode: "0755"

- name: Link Herdr config file
  ansible.builtin.file:
    src: "{{ herdr_source_config_file }}"
    dest: "{{ herdr_config_file }}"
    state: link
    force: true
    follow: false
