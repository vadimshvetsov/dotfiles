---
- name: Install OpenCode skills as the owner
  become: "{{ user_context_user != ansible_facts['user_id'] }}"
  become_user: "{{ user_context_user }}"
  environment:
    HOME: "{{ user_context_home }}"
  block:
    - name: Inspect the OpenCode configuration root
      ansible.builtin.stat:
        path: "{{ skills_install_dir | dirname }}"
        follow: false
      register: skills_config_root

    - name: Require a real OpenCode configuration directory
      ansible.builtin.assert:
        that: not (skills_config_root.stat.islnk | default(false))
        fail_msg: Run the opencode tag first to migrate the old configuration directory link.
      when: not ansible_check_mode

    - name: Create OpenCode skill directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop: ["{{ skills_install_dir }}", "{{ skills_sources_dir }}"]

    - name: Fetch pinned skill source repositories
      ansible.builtin.git:
        repo: "{{ item.value.repo }}"
        dest: "{{ skills_sources_dir }}/{{ item.key }}"
        version: "{{ item.value.version }}"
        refspec: "{{ item.value.version }}"
        depth: 1
        recursive: false
      loop: "{{ skills_repositories | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Inspect selected skill manifests
      ansible.builtin.stat:
        path: "{{ skills_sources_dir }}/{{ item.repository }}/{{ item.path }}/SKILL.md"
      loop: "{{ skills_items }}"
      loop_control:
        label: "{{ item.name }}"
      register: skills_manifests
      when: not ansible_check_mode

    - name: Require every selected skill manifest
      ansible.builtin.assert:
        that: item.stat.isreg | default(false)
        fail_msg: "Missing manifest for {{ item.item.name }} at its pinned source."
      loop: "{{ skills_manifests.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: not ansible_check_mode

    - name: Link selected skills into the OpenCode catalog
      ansible.builtin.file:
        src: "{{ skills_sources_dir }}/{{ item.repository }}/{{ item.path }}"
        dest: "{{ skills_install_dir }}/{{ item.name }}"
        state: link
        force: true
        follow: false
      loop: "{{ skills_items }}"
      loop_control:
        label: "{{ item.name }}"
      when: not ansible_check_mode

    - name: Link locally maintained OpenCode skills
      ansible.builtin.file:
        src: "{{ item.source }}"
        dest: "{{ skills_install_dir }}/{{ item.name }}"
        state: link
        force: true
        follow: false
      loop: "{{ skills_local_items }}"
      loop_control:
        label: "{{ item.name }}"
      when: not ansible_check_mode
