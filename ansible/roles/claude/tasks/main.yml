---
- name: Build Claude agents
  ansible.builtin.command:
    argv:
      - python3
      - "{{ claude_agents_build_script }}"
      - --target
      - claude
  changed_when: false

- name: Create Claude config directory
  ansible.builtin.file:
    path: "{{ claude_config_dir }}"
    state: directory
    mode: "0755"

- name: Check Claude agents path
  ansible.builtin.stat:
    path: "{{ claude_config_dir }}/agents"
    follow: false
  register: claude_agents_path

- name: Remove old Claude agents symlink
  ansible.builtin.file:
    path: "{{ claude_config_dir }}/agents"
    state: absent
  when: claude_agents_path.stat.islnk | default(false)

- name: Create Claude agents directory
  ansible.builtin.file:
    path: "{{ claude_config_dir }}/agents"
    state: directory
    mode: "0755"

- name: Copy Claude agents
  ansible.builtin.copy:
    src: "{{ claude_agents_source_dir }}/"
    dest: "{{ claude_config_dir }}/agents/"
    mode: "0644"
    directory_mode: "0755"

- name: Check Claude settings path
  ansible.builtin.stat:
    path: "{{ claude_config_dir }}/settings.json"
    follow: false
  register: claude_settings_path

- name: Remove old Claude settings symlink
  ansible.builtin.file:
    path: "{{ claude_config_dir }}/settings.json"
    state: absent
  when: claude_settings_path.stat.islnk | default(false)

- name: Copy Claude settings
  ansible.builtin.copy:
    src: "{{ claude_settings_source_file }}"
    dest: "{{ claude_config_dir }}/settings.json"
    mode: "0644"
