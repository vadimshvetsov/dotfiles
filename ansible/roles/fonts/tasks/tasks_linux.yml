---
- name: Install fontconfig (Debian/Ubuntu)
  ansible.builtin.apt:
    name:
      - fontconfig
      - unzip
    state: present
    update_cache: true
  when: ansible_distribution in ["Debian", "Ubuntu"]
  become: true

- name: Install fontconfig (RedHat/CentOS/Fedora)
  ansible.builtin.dnf:
    name:
      - fontconfig
      - unzip
    state: present
  when: ansible_distribution in ["RedHat", "CentOS", "Fedora"]
  become: true

- name: Create fonts directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/share/fonts"
    state: directory
    mode: '0755'

- name: Download and install Nerd Fonts
  loop:
    - "FiraCode"
    - "VictorMono"
  block:
    - name: Download Nerd Font {{ item }}
      ansible.builtin.get_url:
        url: "https://github.com/ryanoasis/nerd-fonts/releases/latest/download/{{ item }}.zip"
        dest: "/tmp/{{ item }}.zip"
        mode: '0644'

    - name: Extract Nerd Font {{ item }}
      ansible.builtin.unarchive:
        src: "/tmp/{{ item }}.zip"
        dest: "{{ ansible_env.HOME }}/.local/share/fonts"
        remote_src: true
        creates: "{{ ansible_env.HOME }}/.local/share/fonts/{{ item }}NerdFont-Regular.ttf"

    - name: Clean up download {{ item }}
      ansible.builtin.file:
        path: "/tmp/{{ item }}.zip"
        state: absent

- name: Refresh font cache
  ansible.builtin.command: fc-cache -f -v
  changed_when: false
