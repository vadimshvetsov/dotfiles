---
- name: Validate the target account and platform
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] in ['Darwin', 'Debian']
      - user_context_user != 'root'
      - ansible_facts['os_family'] != 'Darwin' or user_context_user == ansible_facts['user_id']
    fail_msg: Run macOS as the owner; Linux administrators may set dotfiles_user explicitly.

- name: Look up the Linux account
  ansible.builtin.getent:
    database: passwd
    key: "{{ user_context_user }}"
  when: ansible_facts['os_family'] == 'Debian'

- name: Resolve the target home directory
  ansible.builtin.set_fact:
    user_context_home: >-
      {{ user_context_home_override if user_context_home_override | length > 0 else
      (ansible_facts['getent_passwd'][user_context_user][4] if ansible_facts['os_family'] == 'Debian'
      else ansible_facts['user_dir']) }}
