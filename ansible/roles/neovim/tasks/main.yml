---
- name: Require a supported neovim platform
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] in neovim_arch_map

- name: Install neovim as the owner
  become: "{{ user_context_user != ansible_facts['user_id'] }}"
  become_user: "{{ user_context_user }}"
  environment:
    HOME: "{{ user_context_home }}"
  block:
    - name: Create neovim installation directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ neovim_install_dir }}", mode: "0755" }
        - { path: "{{ neovim_cache_dir }}", mode: "0700" }
        - { path: "{{ user_context_home }}/.local/bin", mode: "0755" }

    - name: Download the verified neovim archive
      ansible.builtin.get_url:
        url: "https://github.com/neovim/neovim/releases/download/v{{ neovim_version }}/{{ neovim_archive }}"
        dest: "{{ neovim_cache_dir }}/{{ neovim_archive }}"
        checksum: "{{ neovim_checksums[neovim_platform ~ '-' ~ neovim_arch_map[ansible_facts['architecture']]] }}"
        mode: "0600"
      when: not ansible_check_mode

    - name: Extract the pinned neovim release
      ansible.builtin.command:
        argv: [tar, '-xzf', "{{ neovim_cache_dir }}/{{ neovim_archive }}", '-C', "{{ neovim_install_dir }}", '--strip-components=1']
        creates: "{{ neovim_install_dir }}/bin/nvim"
      when: not ansible_check_mode

    - name: Link the neovim executable
      ansible.builtin.file:
        src: "{{ neovim_install_dir }}/bin/nvim"
        dest: "{{ neovim_executable }}"
        state: link
        force: true
        follow: false
      when: not ansible_check_mode

    - name: Verify neovim runs
      ansible.builtin.command:
        argv: ["{{ neovim_executable }}", '--version']
      changed_when: false
      when: not ansible_check_mode
