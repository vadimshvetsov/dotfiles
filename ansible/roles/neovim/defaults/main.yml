---
neovim_version: 0.12.6
neovim_platform: "{{ 'macos' if ansible_facts['os_family'] == 'Darwin' else 'linux' }}"
neovim_arch_map:
  x86_64: x86_64
  aarch64: arm64
  arm64: arm64
neovim_archive: "nvim-{{ neovim_platform }}-{{ neovim_arch_map[ansible_facts['architecture']] }}.tar.gz"
neovim_install_dir: "{{ user_context_home }}/.local/share/neovim/{{ neovim_version }}"
neovim_cache_dir: "{{ user_context_home }}/.cache/neovim-install"
neovim_executable: "{{ user_context_home }}/.local/bin/nvim"
neovim_checksums:
