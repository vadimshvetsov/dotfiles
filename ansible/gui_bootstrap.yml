---
- name: Bootstrap GUI applications and desktop assets
  hosts: all
  roles:
    - { role: fonts, tags: fonts }
    - { role: ghostty, tags: ghostty }
  tasks:
    - name: Enable the LazyVim X11 clipboard provider
      ansible.builtin.import_tasks: roles/lazyvim/tasks/clipboard.yml
      vars:
        lazyvim_install_xclip: true
      tags: desktop_clipboard
