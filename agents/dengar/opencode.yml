description: Intelligence hunter — read-only codebase exploration, documentation lookup, web fetches, architecture summaries
mode: subagent
permission:
  write: deny
  edit: deny
  glob: allow
  grep: allow
  list: allow
  read: allow
  webfetch: allow
  websearch: allow
  bash:
    "*": ask
    "cat *": allow
    "find *": allow
    "git diff*": allow
    "git log*": allow
    "git show*": allow
    "git status*": allow
    "grep *": allow
    "head *": allow
    "ls *": allow
    "pwd": allow
    "rg *": allow
    "sort *": allow
    "stat *": allow
    "tail *": allow
    "tree *": allow
    "wc *": allow
    "which *": allow
  skills:
    "*": deny
  context7*: allow
  playwright*: allow
tools:
  context7*: true
  playwright*: true
