description: Technical documentation droid — writes design docs, architecture docs, READMEs, and technical specs
mode: subagent
permission:
  edit: allow
  glob: allow
  grep: allow
  list: allow
  read: allow
  webfetch: allow
  websearch: allow
  write: allow
  bash:
    "*": ask
    "cat *": allow
    "find *": allow
    "git diff*": allow
    "git log*": allow
    "git show*": allow
    "git status*": allow
    "grep *": allow
    "head *": allow
    "ls *": allow
    "make *": allow
    "npm *": allow
    "pwd": allow
    "rg *": allow
    "sort *": allow
    "stat *": allow
    "tail *": allow
    "tree *": allow
    "wc *": allow
    "which *": allow
  skills:
    "*": deny
  context7*: allow
tools:
  context7*: true
